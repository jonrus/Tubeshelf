name: PR Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1" }
      - run: bun install --frozen-lockfile
      - run: bun run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1" }
      - run: bun install --frozen-lockfile
      - run: bun test
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1" }
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1" }
      - run: bun install --frozen-lockfile
      - run: bun run fallow
  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tubeshelf:pr-check .
      - name: Verify PUID/PGID remap
        run: |
          uid=$(docker run --rm -e PUID=1234 -e PGID=5678 tubeshelf:pr-check id -u)
          gid=$(docker run --rm -e PUID=1234 -e PGID=5678 tubeshelf:pr-check id -g)
          test "$uid" = "1234"
          test "$gid" = "5678"
      - name: Verify PUID/PGID default to 1000
        run: |
          uid=$(docker run --rm tubeshelf:pr-check id -u)
          gid=$(docker run --rm tubeshelf:pr-check id -g)
          test "$uid" = "1000"
          test "$gid" = "1000"
